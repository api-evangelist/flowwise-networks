name: FlowWise Networks
description: FlowWise Networks was a computer-networking hardware company founded in 1996 and headquartered
  in San Jose, California, that built layer 2, 3, and 4 wire-speed, self-configuring router-acceleration
  products designed to boost enterprise network performance with minimal disruption of service. Backed
  by Alta Partners, Battery Ventures, InveStar Capital, Mitsubishi Electric, and TL Ventures (roughly
  $21M-$27.5M raised), the company was acquired by Network Equipment Technologies (N.E.T.) in January
  2000. It is long defunct and operates no public API, developer portal, or SDKs; this record is retained
  for VC portfolio-graph provenance only and is not an enrichable API provider.
